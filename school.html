<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>School</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #ebebeb;
            font-family: sans-serif;
        }
        #canvas {
            width: 100vw; height: 100vh; position: relative;
            overflow: hidden;
        }
        #back-btn {
            position: fixed;
            top: 28px; left: 28px;
            width: 40px; height: 40px;
            cursor: pointer; z-index: 100;
        }
        .dot-wrap {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        .dot-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #00FF00;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s ease;
        }
        .dot-wrap:hover .dot-circle {
            transform: scale(1.06);
        }
        .dot-label-inside {
            color: #000;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            position: relative;
            z-index: 2;
        }
        .dot-wrap:hover .dot-label-inside {
            opacity: 1;
        }
        .dot-label-above {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: #000;
            font-weight: 600;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 10;
        }
        .dot-wrap:hover .dot-label-above {
            opacity: 1;
        }
        /* 클릭 상태 */
        .dot-wrap.focused {
            opacity: 1 !important;
        }
        .dot-wrap.focused .dot-label-inside,
        .dot-wrap.focused .dot-label-above {
            opacity: 1 !important;
        }
        .dot-wrap.dimmed {
            opacity: 0.15 !important;
        }
        /* 도넛 */
        .donut {
            position: absolute;
            border-radius: 50%;
            border: 2px solid #000000;
            background: transparent;
            pointer-events: none;
            z-index: 3;
        }
    </style>
</head>
<body>
    <svg id="back-btn" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"
         onclick="window.location.href='index.html'">
        <line x1="32" y1="20" x2="8" y2="20" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
        <polyline points="18,10 8,20 18,30" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <div id="canvas"></div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5ik6NBgUmc8yqJU0ZGStIv7BKToWATo5oj6pooV8KBHz_CTPwbORSdT93aF59rqEO_ENXdmEkUxXL/pub?gid=403210794&single=true&output=csv';

        let nodes = [];
        let baseW = 0, baseH = 0;
        let spreadDone = false;
        let focusedNode = null;
        let animFrames = [];

        const MIN_FONT = 11;

        function parseCSV(text) {
            const rows = [];
            let row = [], cell = '', inQ = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (c === '"') { inQ = !inQ; }
                else if (c === ',' && !inQ) { row.push(cell.trim()); cell = ''; }
                else if ((c === '\n' || c === '\r') && !inQ) {
                    if (cell !== '' || row.length) { row.push(cell.trim()); rows.push(row); }
                    row = []; cell = '';
                }
                else { cell += c; }
            }
            if (row.length) { row.push(cell.trim()); rows.push(row); }
            return rows;
        }

        function measureText(text, fontSize) {
            const t = document.createElement('span');
            t.style.cssText = `position:absolute;visibility:hidden;white-space:nowrap;font-weight:600;font-size:${fontSize}px;font-family:sans-serif;`;
            t.textContent = text;
            document.body.appendChild(t);
            const w = t.offsetWidth;
            document.body.removeChild(t);
            return w;
        }

        /* ── 도넛 애니메이션 ── */
        function spawnDonuts(node) {
            const circle = node.el.querySelector('.dot-circle');
            const R = node.r;
            const count = node.count;
            const donuts = [];

            /* 도넛 크기: 점 크기에 비례, 최소 8 최대 R*0.35 */
            const donutR = Math.max(8, Math.min(R * 0.04, 5));
            const borderW = 5

            for (let i = 0; i < count; i++) {
                const d = document.createElement('div');
                d.className = 'donut';
                const size = donutR * 2;
                d.style.width  = size + 'px';
                d.style.height = size + 'px';
                d.style.borderWidth = borderW + 'px';

                /* 초기 위치: 원 내부 랜덤 */
                const maxOff = R - donutR - 4;
                const angle  = Math.random() * Math.PI * 2;
                const rad    = Math.random() * maxOff;
                let px = R + Math.cos(angle) * rad;
                let py = R + Math.sin(angle) * rad;

                d.style.left = px + 'px';
                d.style.top  = py + 'px';
                d.style.transform = 'translate(-50%, -50%)';

                circle.appendChild(d);

                /* 각 도넛의 물리 상태 */
                donuts.push({
                    el: d,
                    x: px, y: py,
                    vx: (Math.random() - 0.5) * 1.2,
                    vy: (Math.random() - 0.5) * 1.2,
                    r: donutR
                });
            }

            node.donuts = donuts;

            /* 애니메이션 루프 */
            function animate() {
                const boundary = R - donutR - 2;
                donuts.forEach(dn => {
                    dn.x += dn.vx;
                    dn.y += dn.vy;

                    /* 원 경계 반사 */
                    const cx = R, cy = R;
                    const dx = dn.x - cx, dy = dn.y - cy;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > boundary) {
                        /* 법선 방향으로 반사 */
                        const nx = dx / dist, ny = dy / dist;
                        const dot = dn.vx * nx + dn.vy * ny;
                        dn.vx -= 2 * dot * nx;
                        dn.vy -= 2 * dot * ny;
                        dn.x = cx + nx * (boundary - 1);
                        dn.y = cy + ny * (boundary - 1);
                    }

                    /* 도넛끼리 충돌 */
                    donuts.forEach(other => {
                        if (other === dn) return;
                        const ddx = other.x - dn.x, ddy = other.y - dn.y;
                        const d2 = Math.sqrt(ddx*ddx + ddy*ddy) || 0.1;
                        const minD = dn.r + other.r + 2;
                        if (d2 < minD) {
                            const nx2 = ddx/d2, ny2 = ddy/d2;
                            const rel = (dn.vx - other.vx)*nx2 + (dn.vy - other.vy)*ny2;
                            if (rel > 0) {
                                dn.vx -= rel * nx2;
                                dn.vy -= rel * ny2;
                                other.vx += rel * nx2;
                                other.vy += rel * ny2;
                            }
                            const overlap = minD - d2;
                            dn.x -= nx2 * overlap * 0.5;
                            dn.y -= ny2 * overlap * 0.5;
                            other.x += nx2 * overlap * 0.5;
                            other.y += ny2 * overlap * 0.5;
                        }
                    });

                    dn.el.style.left = dn.x + 'px';
                    dn.el.style.top  = dn.y + 'px';
                });

                const af = requestAnimationFrame(animate);
                animFrames.push(af);
            }

            const af = requestAnimationFrame(animate);
            animFrames.push(af);
        }

        function clearDonuts(node) {
            if (!node || !node.donuts) return;
            node.donuts.forEach(d => d.el.remove());
            node.donuts = [];
        }

        function stopAnims() {
            animFrames.forEach(af => cancelAnimationFrame(af));
            animFrames = [];
        }

        function enterFocus(node) {
            focusedNode = node;
            nodes.forEach(n => {
                n.el.classList.remove('focused', 'dimmed');
                n.el.classList.add(n === node ? 'focused' : 'dimmed');
            });
            spawnDonuts(node);
        }

        function exitFocus() {
            if (focusedNode) clearDonuts(focusedNode);
            stopAnims();
            focusedNode = null;
            nodes.forEach(n => n.el.classList.remove('focused', 'dimmed'));
        }

        async function init() {
            try {
                const res  = await fetch(SHEET_CSV_URL);
                const csv  = await res.text();
                const rows = parseCSV(csv);

                const countMap = {};
                rows.slice(1).forEach(row => {
                    const cell = (row[4] || '').trim();
                    cell.split(/\r?\n/).forEach(w => {
                        const word = w.trim();
                        if (word) countMap[word] = (countMap[word] || 0) + 1;
                    });
                });

                const W = window.innerWidth;
                const H = window.innerHeight;
                baseW = W; baseH = H;

                const maxCount = Math.max(...Object.values(countMap));
                const minCount = Math.min(...Object.values(countMap));
                const MAX_R = Math.min(W, H) * 0.25;
                const MIN_R = 10;

                Object.entries(countMap).forEach(([word, count]) => {
                    const ratio = minCount === maxCount ? 1
                        : (count - minCount) / (maxCount - minCount);
                    const r = Math.round(MIN_R + Math.sqrt(ratio) * (MAX_R - MIN_R));

                    const innerW = r * Math.sqrt(2) * 0.85;
                    let bestFont = MIN_FONT;
                    for (let fs = MIN_FONT; fs <= 72; fs++) {
                        const tw = measureText(word, fs);
                        if (tw <= innerW && fs * 1.2 <= r * 1.6) bestFont = fs;
                        else break;
                    }
                    const textW = measureText(word, bestFont);
                    const inside = textW <= innerW && bestFont >= MIN_FONT && r >= 20;

                    nodes.push({ word, count, r, fontSize: bestFont, labelInside: inside,
                        x: W/2, y: H/2, tx: W/2, ty: H/2,
                        nx: 0.5, ny: 0.5, el: null, donuts: [] });
                });

                nodes.sort((a, b) => b.count - a.count);
                buildDOM();
                computeTargetPositions();
                doSpread();

            } catch(e) { console.error(e); }
        }

        function buildDOM() {
            const canvas = document.getElementById('canvas');
            const cx = window.innerWidth / 2, cy = window.innerHeight / 2;

            nodes.forEach(node => {
                const wrap = document.createElement('div');
                wrap.className = 'dot-wrap';
                wrap.style.width  = node.r * 2 + 'px';
                wrap.style.height = node.r * 2 + 'px';
                wrap.style.left   = cx + 'px';
                wrap.style.top    = cy + 'px';
                wrap.style.opacity = '0';
                wrap.style.transition = 'opacity 0.3s ease, left 0.45s cubic-bezier(0.15,1,0.3,1), top 0.45s cubic-bezier(0.15,1,0.3,1)';

                const circle = document.createElement('div');
                circle.className = 'dot-circle';

                if (node.labelInside) {
                    const label = document.createElement('span');
                    label.className = 'dot-label-inside';
                    label.textContent = node.word;
                    label.style.fontSize = node.fontSize + 'px';
                    circle.appendChild(label);
                } else {
                    const label = document.createElement('div');
                    label.className = 'dot-label-above';
                    label.textContent = node.word;
                    label.style.fontSize = Math.max(MIN_FONT, node.fontSize) + 'px';
                    label.style.bottom = (node.r * 2 + 6) + 'px';
                    wrap.appendChild(label);
                }

                wrap.appendChild(circle);
                canvas.appendChild(wrap);
                node.el = wrap;

                wrap.addEventListener('click', () => {
                    if (!spreadDone) return;
                    if (focusedNode === node) exitFocus();
                    else { if (focusedNode) exitFocus(); enterFocus(node); }
                });
            });
        }

        function computeTargetPositions() {
            const W = window.innerWidth, H = window.innerHeight;
            const N = nodes.length;
            const mg = 20;

            nodes.forEach(n => {
                n.x = mg + n.r + Math.random() * (W - mg*2 - n.r*2);
                n.y = mg + n.r + Math.random() * (H - mg*2 - n.r*2);
            });

            for (let iter = 0; iter < 3000; iter++) {
                for (let i = 0; i < N; i++) {
                    for (let j = i+1; j < N; j++) {
                        const a = nodes[i], b = nodes[j];
                        const dx = b.x-a.x, dy = b.y-a.y;
                        const dist = Math.sqrt(dx*dx+dy*dy) || 0.1;
                        const minDist = a.r + b.r + 10;
                        if (dist < minDist) {
                            const push = (minDist - dist) * 0.52;
                            a.x -= (dx/dist)*push; a.y -= (dy/dist)*push;
                            b.x += (dx/dist)*push; b.y += (dy/dist)*push;
                        }
                    }
                }
                nodes.forEach(n => {
                    n.x = Math.max(mg+n.r, Math.min(W-mg-n.r, n.x));
                    n.y = Math.max(mg+n.r, Math.min(H-mg-n.r, n.y));
                });
            }

            let hasOverlap = true, safety = 0;
            while (hasOverlap && safety < 500) {
                hasOverlap = false; safety++;
                for (let i = 0; i < N; i++) {
                    for (let j = i+1; j < N; j++) {
                        const a = nodes[i], b = nodes[j];
                        const dx = b.x-a.x, dy = b.y-a.y;
                        const dist = Math.sqrt(dx*dx+dy*dy) || 0.1;
                        const minDist = a.r + b.r + 10;
                        if (dist < minDist) {
                            hasOverlap = true;
                            const push = (minDist-dist)*0.5+1;
                            a.x -= (dx/dist)*push; a.y -= (dy/dist)*push;
                            b.x += (dx/dist)*push; b.y += (dy/dist)*push;
                            a.x = Math.max(mg+a.r, Math.min(W-mg-a.r, a.x));
                            a.y = Math.max(mg+a.r, Math.min(H-mg-a.r, a.y));
                            b.x = Math.max(mg+b.r, Math.min(W-mg-b.r, b.x));
                            b.y = Math.max(mg+b.r, Math.min(H-mg-b.r, b.y));
                        }
                    }
                }
            }

            nodes.forEach(n => {
                n.tx = Math.max(mg+n.r, Math.min(W-mg-n.r, n.x));
                n.ty = Math.max(mg+n.r, Math.min(H-mg-n.r, n.y));
                n.nx = n.tx/W; n.ny = n.ty/H;
            });
        }

        function doSpread() {
            requestAnimationFrame(() => requestAnimationFrame(() => {
                spreadDone = true;
                nodes.forEach(node => {
                    node.el.style.opacity = '1';
                    node.el.style.left    = node.tx + 'px';
                    node.el.style.top     = node.ty + 'px';
                });
                setTimeout(() => {
                    nodes.forEach(node => { node.el.style.transition = 'opacity 0.3s ease'; });
                }, 550);
            }));
        }

        function onResize() {
            if (!spreadDone) return;
            const W = window.innerWidth, H = window.innerHeight;
            nodes.forEach(node => {
                node.el.style.left = (node.nx * W) + 'px';
                node.el.style.top  = (node.ny * H) + 'px';
            });
        }

        window.addEventListener('resize', onResize);
        init();
    </script>
</body>
</html>
